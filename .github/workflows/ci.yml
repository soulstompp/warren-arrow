name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Formatting
        run: cargo fmt --check
      - name: Tests
        run: cargo test --locked
      - name: Tests with the geo feature
        run: cargo test --locked --features geo
      - name: Clippy
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --all-targets --features geo -- -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - name: The oldest Rust the crate builds with
        run: |
          cargo check --locked --all-targets
          cargo check --locked --all-targets --features geo
