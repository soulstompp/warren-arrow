[package]
name = "warren-arrow"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Kenneth Allen Flegal"]
description = "Write a layout's tables to Parquet in key order, each certified against its source, and count what a reader keeps from the metadata alone"
license = "Apache-2.0"
repository = "https://github.com/soulstompp/warren-arrow"
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LAYOUT.md", "CHANGELOG.md", "LICENSE", "NOTICE"]
keywords = ["parquet", "arrow", "layout", "partitioning", "certificate"]
categories = ["encoding", "database", "command-line-utilities"]

[[bin]]
name = "warren-arrow"
path = "src/main.rs"

[dependencies]
arrow = { version = "58", default-features = false }
parquet = { version = "58", default-features = false, features = ["arrow", "snap", "zstd", "lz4", "flate2-rust_backened"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
parquet-geospatial = { version = "58", optional = true }

[features]
# A point held as a GEOGRAPHY column, and its geo cell as a key level.
geo = ["parquet/geospatial", "dep:parquet-geospatial"]

[dev-dependencies]
tempfile = "3"
